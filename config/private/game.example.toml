# Private peer settings. Never copy shared game rules into this file.
[identity]
group_id = "GRP00001"
role = "police"
member_names = ["Example Member"]

[network]
listen_host = "127.0.0.1"
listen_port = 8000
opponent_public_url = "http://127.0.0.1:8001"
max_request_bytes = 65536
max_json_depth = 16
max_string_length = 4096
max_collection_items = 256
reorder_window = 8

[paths]
artifact_root = "results/local"

[strategy]
police_class = "police_thief_p2p.services.strategy.police.AdvancedPoliceBrain"
thief_class = "police_thief_p2p.services.strategy.thief.AdvancedThiefBrain"
profile = "balanced"
profile_version = "1.0.0"
seed = 7
decision_budget_ms = 250
guard_margin_ms = 40
search_horizon = 3
posterior_samples = 16
cache_entries = 512
near_tie_epsilon = 0.02
opponent_decay = 0.9

[strategy.police]
capture = 1000.0
distance = 5.0
escape = 2.0
cut = 8.0
information = 0.5
self_trap = 250.0
budget = 1.5
risk = 0.25
cycle = 3.0

[strategy.thief]
survival = 1000.0
risk_distance = 8.0
space = 1.5
routes = 12.0
entropy = 0.5
traps = 100.0
scent = 3.0
corner = 8.0
cycle = 5.0
risk = 0.35

[language]
provider = "template"
model = "deterministic-template"
deadline_sec = 10
# api_key_env = "POLICE_THIEF_LANGUAGE_API_KEY"

[email]
credential_path = "credentials.json"
recipient_allowlist = ["lecturer@example.invalid"]
# oauth_client_secret_env = "POLICE_THIEF_GMAIL_CLIENT_SECRET"

[gui]
enabled = true
theme = "system"

[tunnel]
provider = "local"
health_url = "http://127.0.0.1:8000/health"

[observability]
level = "INFO"

[reliability]
negotiation_timeout_sec = 60
acknowledgement_timeout_sec = 30
reveal_timeout_sec = 30
strategy_timeout_sec = 1
audit_timeout_sec = 120
reporting_timeout_sec = 120
max_attempts = 4
max_backoff_ms = 2000
gameplay_queue_capacity = 128
optional_queue_capacity = 32
circuit_failure_threshold = 3
circuit_cooldown_sec = 10
