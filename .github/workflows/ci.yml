name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Frozen dependency sync
        run: uv sync --frozen --all-groups

      - name: Validate repository contracts
        run: |
          uv run python scripts/validate_structure.py
          uv run python scripts/check_file_hygiene.py
          uv run python scripts/check_file_sizes.py src scripts
          uv run python scripts/validate_traceability.py
          uv run python scripts/validate_imports.py
          uv run python scripts/validate_ci.py

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Strict typing
        run: uv run mypy src tests scripts

      - name: Tests and coverage
        run: uv run pytest

      - name: Build distributions
        run: uv build

  macos-smoke:
    name: macOS / Python 3.13 smoke
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true

      - name: Frozen dependency sync
        run: uv sync --frozen --all-groups

      - name: Import and focused smoke test
        run: |
          uv run python -c "from police_thief_p2p import SimulationSdk; assert SimulationSdk().check_readiness().is_ready"
          uv run pytest tests/unit/test_version.py --no-cov
